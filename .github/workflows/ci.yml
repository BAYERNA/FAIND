name: CI

# Phase 8: PR #1은 처음부터 "CI 없음(0 statuses)"이었다 — Phase 7에서 만든 자동화 테스트
# (backend 17개 / ai-server 12개 / notification-server 8개)가 이 워크플로우가 생기기 전까지는
# 로컬에서만 돌았다. 6개 런타임을 각자 독립된 job으로 검증해, 어느 하나가 깨져도 나머지는
# 계속 결과를 볼 수 있게 한다.
on:
  # PR이 열려 있는 브랜치에 push하면 push/pull_request 두 이벤트가 동시에 발생해 같은 커밋을
  # 두 번 돌리게 된다 — push는 main 직접 반영(머지 후)만 잡고, 브랜치 작업은 pull_request로 커버.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Java 21 / Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # 이번에 추가한 테스트(IncidentService/IncidentConfirmService/Device)는 전부 Mockito
      # 단위 테스트라 실 DB가 필요 없다 — Postgres 서비스 컨테이너를 띄우지 않는다.
      - run: ./gradlew test compileJava --no-daemon

  ai-server:
    name: ai-server (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # tests/test_yolo_service.py는 실제 YOLO 가중치 없이도 도는 순수 계산 테스트라
      # 모델 파일을 내려받거나 GPU를 준비할 필요가 없다.
      - run: pytest tests/ -v

  notification-server:
    name: notification-server (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: notification-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  admin-web:
    name: admin-web (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      # Phase 9에서 추가한 jsdom@30/vitest@5가 Node 22.22+를 요구한다(20에서는
      # "webidl.util.markAsUncloneable is not a function"으로 vitest worker가 죽는다) —
      # 프론트엔드 3개 job만 22로 올린다. notification-server는 jsdom을 안 써서 20 그대로 둔다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run test

  commander-tablet:
    name: commander-tablet (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commander-tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commander-tablet/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run test

  responder-app:
    name: responder-app (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: responder-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: responder-app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run test
