# dev server의 vite.config.ts 프록시 규칙과 동일한 라우팅을 프로덕션 빌드에서 nginx로 재현한다.
# 브라우저는 이 nginx 오리진 하나만 보므로 CORS 설정이 필요 없다(서버 간 프록시는 CORS 대상이 아님).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /notify/ {
        rewrite ^/notify/(.*)$ /$1 break;
        proxy_pass http://notification-server:3001;
        proxy_set_header Host $host;
    }

    # FR-06/18/22/23 실시간 알림용 WebSocket. Upgrade 헤더를 그대로 전달해야 연결이 유지된다.
    location /socket.io/ {
        proxy_pass http://notification-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # BrowserRouter를 쓰므로 새로고침·직접 진입 시에도 index.html로 폴백해야 한다.
    location / {
        try_files $uri /index.html;
    }
}
